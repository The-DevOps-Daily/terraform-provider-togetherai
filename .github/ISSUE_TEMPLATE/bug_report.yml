name: Bug report
description: Report a reproducible problem with the provider.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use the private reporting link in our [security policy](https://github.com/The-DevOps-Daily/terraform-provider-togetherai/blob/main/SECURITY.md).
        Never paste API keys in an issue. Remove secrets, kubeconfigs and private data from all examples and logs.
  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      description: Run terraform version.
    validations:
      required: true
  - type: input
    id: provider-version
    attributes:
      label: Provider version
      description: Include the commit ID if using a local build.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration snippet
      description: Share the smallest configuration that shows the problem. Remove API keys, kubeconfigs and other secrets.
      render: hcl
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the commands and steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include the error message, if any, with secrets removed.
    validations:
      required: true
  - type: textarea
    id: debug-output
    attributes:
      label: Debug output
      description: Optional. Share relevant TF_LOG=DEBUG output only after removing secrets, authorization headers, kubeconfigs and private data. Do not attach Terraform state.
      render: text
