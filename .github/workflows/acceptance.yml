name: Acceptance

# Manual only. These tests create real Together AI resources, and the paid
# ones bill real money, so they never run on a schedule or on pull requests.
on:
  workflow_dispatch:
    inputs:
      expensive:
        description: "Also run the tests that cost money (see the README for costs)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: togetherai-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Real-API acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      TOGETHER_PROJECT_ID: ${{ secrets.TOGETHER_PROJECT_ID }}
      TOGETHER_ACC_EXPENSIVE: ${{ inputs.expensive && '1' || '' }}
      TF_ACC: '1'
      CHECKPOINT_DISABLE: '1'
    steps:
      - name: Check credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "$TOGETHER_API_KEY" ]; then
            echo "::notice::Skipping acceptance tests: the TOGETHER_API_KEY repository secret is required."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.available == 'true'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.credentials.outputs.available == 'true'
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.credentials.outputs.available == 'true'
        with:
          terraform_wrapper: false
      - name: Run acceptance tests
        if: steps.credentials.outputs.available == 'true'
        run: go test ./internal/provider/ -run '^TestAcc' -v -count=1 -timeout 120m
